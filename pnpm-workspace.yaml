packages:
    - apps/*
    - packages/*
allowBuilds:
    "@parcel/watcher": false
    "@posthog/cli": true
    "@shopify/react-native-skia": true
    better-sqlite3: true
    core-js: false
    esbuild: true
    sharp: false
    unrs-resolver: false
catalog:
    "@better-auth/expo": 1.6.15
    "@confect/cli": ^10.4.1
    "@confect/core": ^10.4.1
    "@confect/server": ^10.4.1
    "@convex-dev/agent": ^0.7.8
    "@convex-dev/better-auth": ^0.12.6
    "@effect/atom-react": ^4.0.7
    better-auth: 1.6.15
    convex: ^1.48.0
    dotenv: ^18.0.9
    effect: ^4.0.7
    intlayer: ^9.7.0
    react-intlayer: ^9.7.0
    react-native-intlayer: ^9.7.0
    vite-intlayer: ^9.7.0
    zod: ^4.6.7
    typescript: ~6.0.3
    varlock: 1.23.0
    vite: npm:@voidzero-dev/vite-plus-core@1.4.0
    vite-plus: 1.4.0
packageExtensions:
    "@tanstack/react-router":
        peerDependencies:
            "@types/react": "*"
        peerDependenciesMeta:
            "@types/react":
                optional: true
    "@tanstack/react-start-client":
        peerDependencies:
            "@types/react": "*"
        peerDependenciesMeta:
            "@types/react":
                optional: true
# 12h instead of pnpm's 24h default so the Expo SDK 58.0.20 refresh (#176) installs in CI.
minimumReleaseAge: 720
minimumReleaseAgeExclude:
    - panelui-native@0.75.1

patchedDependencies:
    "@convex-dev/agent@0.7.8": patches/@convex-dev__agent@0.7.8.patch
    "@confect/server@10.4.1": patches/@confect__server@10.4.1.patch
    "@expo/fingerprint@0.21.7": patches/@expo__fingerprint@0.21.7.patch
    "@hugeicons/react-native@1.0.16": patches/@hugeicons__react-native@1.0.16.patch
    "@tanstack/ai-mcp@1.0.0": patches/@tanstack__ai-mcp@1.0.0.patch
    expo-router@58.0.27: patches/expo-router@58.0.27.patch
    expo-widgets@58.0.24: patches/expo-widgets@58.0.24.patch
    number-flow-react-native@0.5.1: patches/number-flow-react-native@0.5.1.patch
    panelui-native@0.115.0: patches/panelui-native@0.115.0.patch
    react-native-nano-icons@1.0.1: patches/react-native-nano-icons@1.0.1.patch
overrides:
    "@coderabbitai/config>zod": "catalog:"
    vite@*: "catalog:"
peerDependencyRules:
    allowAny:
        - vite
    allowedVersions:
        vite: "*"
