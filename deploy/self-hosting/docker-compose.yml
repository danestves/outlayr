name: outlayr

services:
    convex:
        image: ghcr.io/convex/convex-backend:${CONVEX_VERSION:-cf39368b85da10d95522e27960d57833c048ea56}
        restart: unless-stopped
        stop_grace_period: 10s
        stop_signal: SIGINT
        ports:
            - "${BIND_ADDRESS:-0.0.0.0}:${CONVEX_PORT:-3210}:3210"
            - "${BIND_ADDRESS:-0.0.0.0}:${CONVEX_SITE_PORT:-3211}:3211"
        volumes:
            - convex-data:/convex/data
        environment:
            INSTANCE_NAME: ${INSTANCE_NAME:-}
            INSTANCE_SECRET: ${INSTANCE_SECRET:-}
            CONVEX_CLOUD_ORIGIN: ${CONVEX_CLOUD_ORIGIN:?Set CONVEX_CLOUD_ORIGIN in .env}
            CONVEX_SITE_ORIGIN: ${CONVEX_SITE_ORIGIN:?Set CONVEX_SITE_ORIGIN in .env}
            DISABLE_BEACON: ${DISABLE_BEACON:-}
        healthcheck:
            test: ["CMD", "curl", "-fsS", "http://localhost:3210/version"]
            interval: 5s
            timeout: 5s
            retries: 12
            start_period: 10s

    convex-dashboard:
        image: ghcr.io/convex/convex-dashboard:${CONVEX_VERSION:-cf39368b85da10d95522e27960d57833c048ea56}
        restart: unless-stopped
        stop_grace_period: 10s
        stop_signal: SIGINT
        ports:
            - "${BIND_ADDRESS:-0.0.0.0}:${DASHBOARD_PORT:-6791}:6791"
        environment:
            NEXT_PUBLIC_DEPLOYMENT_URL: ${CONVEX_CLOUD_ORIGIN}
        depends_on:
            convex:
                condition: service_healthy

    backend:
        image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_OWNER:-danestves}/outlayr-backend:${IMAGE_TAG:-edge}
        restart: "no"
        environment:
            CONVEX_SELF_HOSTED_URL: http://convex:3210
            CONVEX_SELF_HOSTED_ADMIN_KEY: ${CONVEX_SELF_HOSTED_ADMIN_KEY:-}
            SITE_URL: ${APP_ORIGIN:?Set APP_ORIGIN in .env}
        volumes:
            - ./convex.env:/run/outlayr/convex.env:ro
        depends_on:
            convex:
                condition: service_healthy

    app:
        image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_OWNER:-danestves}/outlayr-app:${IMAGE_TAG:-edge}
        restart: unless-stopped
        ports:
            - "${BIND_ADDRESS:-0.0.0.0}:${APP_PORT:-3080}:3000"
        environment:
            VITE_CONVEX_URL: ${CONVEX_CLOUD_ORIGIN}
            VITE_CONVEX_SITE_URL: ${CONVEX_SITE_ORIGIN}
            CONVEX_INTERNAL_URL: http://convex:3210
        depends_on:
            backend:
                condition: service_completed_successfully

volumes:
    convex-data:
