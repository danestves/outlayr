steps:
    - echo: On the Log with the seeded ledger; open Balances, come back, then add a 12.50 entry at Lidl
    - await: { visible: { text: Hide amounts }, timeout: 20000 }
    - tap: { text: Balances }
    - await: { visible: { text: Burn-down chart }, timeout: 10000 }
    - await: { idle: true }
    - tap: { text: Log }
    - await: { visible: { text: Hide amounts }, timeout: 10000 }
    - await: { idle: true }
    - tap: { text: Add }
    - await: { visible: { text: Add a transaction }, timeout: 5000 }
    - tap: { text: Add a transaction }
    - await: { visible: { id: stage-footer }, timeout: 10000 }
    - await: { idle: true }
    - tap: { text: "1" }
    - tap: { text: "2" }
    - tap: { text: . }
    - tap: { text: "5" }
    - tap: { text: "0" }
    - await: { visible: { text: "Amount, $12.50" }, timeout: 5000 }
    - tap: { text: Next }
    - await: { visible: { id: stage-merchant-field }, timeout: 5000 }
    - tap: { text: Lidl }
    - await: { visible: { text: "Name, Lidl" }, timeout: 5000 }
    - tap: { text: Save }
    - await: { visible: { text: Hide amounts }, timeout: 30000 }
    - await: { hidden: { id: stage-footer } }
    - await: { idle: true }
executionPrerequisite: Outlayr dev build on Android, restored from the perf-seeded snapshot (seeded perf ledger, about 3,000 entries over two accounts, a monthly budget and a Transport budget), bundle freshly loaded, on the Log tab scrolled to the top.
