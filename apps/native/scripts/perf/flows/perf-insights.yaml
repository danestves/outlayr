steps:
    - echo: On the Log with the seeded ledger; Insights, Year period, All categories, then filter the Healthcare category so its transaction list mounts
    - await: { visible: { text: Hide amounts }, timeout: 20000 }
    - tap: { text: Insights }
    - await: { visible: { text: Change period }, timeout: 10000 }
    - await: { idle: true }
    - tap: { text: Change period }
    - await: { visible: { text: Year }, timeout: 5000 }
    - tap: { text: Year }
    - await: { idle: true }
    - scroll-to: { target: { text: All categories } }
    - tap: { text: All categories }
    - await: { visible: { text: Breakdown }, timeout: 10000 }
    - await: { idle: true }
    - scroll-to: { target: { text: Healthcare } }
    - await: { idle: true }
    - tap: { text: Healthcare }
    - await: { visible: { text: Filtered category }, timeout: 10000 }
    - await: { idle: true }
executionPrerequisite: Outlayr dev build on Android, restored from the perf-seeded snapshot (seeded perf ledger, about 3,000 entries over two accounts, a monthly budget and a Transport budget), bundle freshly loaded, on the Log tab scrolled to the top.
