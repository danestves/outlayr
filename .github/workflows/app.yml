name: App

on:
    push:
        branches:
            - main
        paths:
            - .github/workflows/app.yml
            - deploy/self-hosting/app.Dockerfile
            - deploy/self-hosting/app.Dockerfile.dockerignore
            - apps/app/**
            - apps/native/**
            - packages/**
            - patches/**
            - .npmrc
            - package.json
            - pnpm-lock.yaml
            - pnpm-workspace.yaml
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: app-${{ github.ref }}
    cancel-in-progress: true

jobs:
    deploy:
        name: Build and deploy
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-26.04
        timeout-minutes: 30
        environment: production
        permissions:
            contents: read
            packages: write
        env:
            # Not the self-hosting outlayr-app image: this one carries our PostHog token.
            IMAGE: ghcr.io/${{ github.repository_owner }}/outlayr-web
        steps:
            - uses: actions/checkout@v7

            - uses: docker/setup-buildx-action@v4

            - uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - uses: docker/build-push-action@v7
              with:
                  context: .
                  file: deploy/self-hosting/app.Dockerfile
                  platforms: linux/amd64
                  push: true
                  tags: |
                      ${{ env.IMAGE }}:latest
                      ${{ env.IMAGE }}:sha-${{ github.sha }}
                  labels: |
                      org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
                      org.opencontainers.image.revision=${{ github.sha }}
                  build-args: |
                      VITE_PUBLIC_POSTHOG_PROJECT_TOKEN=${{ vars.EXPO_PUBLIC_POSTHOG_PROJECT_TOKEN }}

            - name: Deploy on Coolify
              env:
                  COOLIFY_TOKEN: ${{ secrets.COOLIFY_DEPLOY_TOKEN }}
                  APP: ${{ vars.COOLIFY_APP_UUID }}
              run: |
                  curl --fail-with-body --silent --show-error --request POST \
                    --header "Authorization: Bearer $COOLIFY_TOKEN" \
                    "https://hephaestus.sh/api/v1/deploy?uuid=$APP&force=false"
