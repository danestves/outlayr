# Store builds for `rnd build` (react-native-deploy), in place of EAS Build.
#
# rnd dispatches this file by name, finds the run by the `[eas:...]` token in
# run-name, and downloads the `application-archive` artifact. Those three are its
# contract and come from its template. The rest is ours: the template builds from
# the repository root, signs only the app target, and knows no EAS environments.
#
# Repository secrets:
#
#   HUGEICONS_PRO_TOKEN            the private icon registry
#   POSTHOG_CLI_API_KEY            source map uploads
#   EAS_IOS_DIST_P12               base64 .p12 with the distribution certificate and key
#   EAS_IOS_P12_PASSWORD
#   EAS_IOS_PROFILE                base64 App Store profile for com.tryoutlayr.app
#   EAS_IOS_PROFILE_WIDGETS        ... for com.tryoutlayr.app.ExpoWidgetsTarget
#   EAS_IOS_PROFILE_WATCH          ... for com.tryoutlayr.app.watchkitapp
#   EAS_IOS_PROFILE_WATCH_WIDGET   ... for com.tryoutlayr.app.watchkitapp.widget
#   EAS_ANDROID_KEYSTORE           base64 upload keystore
#   EAS_ANDROID_STORE_PASSWORD, EAS_ANDROID_KEY_ALIAS, EAS_ANDROID_KEY_PASSWORD
name: EAS Build

run-name: >-
    ${{ inputs.platform }} ${{ inputs.profile }} build ${{ inputs.version }} [eas:dispatch_id=${{ inputs.dispatch_id }};platform=${{ inputs.platform }};profile=${{ inputs.profile }};distribution=${{ fromJSON(inputs.config_json).distribution }};simulator=${{ fromJSON(inputs.config_json).simulator }}]

on:
    workflow_dispatch:
        inputs:
            dispatch_id:
                description: Correlation id stamped into run-name so rnd can find this run
                required: true
            platform:
                description: ios | android
                required: true
            profile:
                description: Build profile from eas.json. Also selects the GitHub environment.
                required: true
                default: production
            version:
                description: Version both stores show (major.minor.patch)
                required: true
            # Accepted and ignored. rnd maps `resourceClass` to a runner, but its iOS
            # pick (macos-26) has no Xcode 27, and Android's `large` is a larger
            # runner a personal account doesn't get. The build job picks its own.
            runner:
                description: Runner label (ignored)
                required: true
                default: macos-26
            config_json:
                description: The build plan rnd resolved, as JSON
                required: true

concurrency:
    group: eas-build-${{ inputs.platform }}-${{ inputs.profile }}-${{ github.ref }}
    cancel-in-progress: false

jobs:
    check:
        name: Check the build
        runs-on: ubuntu-26.04
        environment: ${{ inputs.profile }}
        steps:
            - name: Check the build profile
              env:
                  PROFILE: ${{ inputs.profile }}
                  PLATFORM: ${{ inputs.platform }}
                  APP_VERSION: ${{ inputs.version }}
              run: |
                  case "$PROFILE" in
                    production|preview) ;;
                    *) echo "::error::Only the preview and production store profiles build here, not '$PROFILE'."; exit 1 ;;
                  esac
                  case "$PLATFORM" in
                    ios|android) ;;
                    *) echo "::error::Unknown platform '$PLATFORM'."; exit 1 ;;
                  esac
                  if ! [[ "$APP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                    echo "::error::The version must be major.minor.patch, not '$APP_VERSION'."
                    exit 1
                  fi

            # The app reads this key at runtime, so a binary built without it
            # builds fine and ships a paywall with no plans.
            - name: Check the Android release setup
              if: inputs.platform == 'android'
              env:
                  EXPO_PUBLIC_REVENUECAT_ANDROID_KEY: ${{ vars.EXPO_PUBLIC_REVENUECAT_ANDROID_KEY }}
                  PROFILE: ${{ inputs.profile }}
              run: |
                  if [ -z "$EXPO_PUBLIC_REVENUECAT_ANDROID_KEY" ]; then
                    echo "::error::EXPO_PUBLIC_REVENUECAT_ANDROID_KEY is not set on the $PROFILE environment."
                    exit 1
                  fi

    # Backend first, so the binary is never newer than the API it calls.
    deploy_backend:
        needs: [check]
        uses: ./.github/workflows/deploy-backend.yml
        with:
            environment: ${{ inputs.profile }}
        secrets: inherit

    build:
        name: Build ${{ inputs.platform }}
        needs: [deploy_backend]
        # Same Xcode as EAS's sdk-58 image (27.0). The image is a GitHub preview.
        runs-on: ${{ inputs.platform == 'ios' && 'xcode-27' || 'ubuntu-26.04' }}
        environment: ${{ inputs.profile }}
        timeout-minutes: 90
        env:
            EAS_PLATFORM: ${{ inputs.platform }}
            # app.config.ts reads it for the app icon and the update channel.
            EAS_BUILD_PROFILE: ${{ inputs.profile }}
            APP_VERSION: ${{ inputs.version }}
            POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
        defaults:
            run:
                shell: bash
                working-directory: apps/native
        steps:
            - uses: actions/checkout@v7

            - uses: ./.github/actions/setup-native
              with:
                  variables: ${{ toJSON(vars) }}
                  hugeicons-token: ${{ secrets.HUGEICONS_PRO_TOKEN }}

            # EAS Build's remote counter ended at iOS 54 and Android 7. Starting past
            # both keeps every upload newer than anything either store has seen.
            - name: Set the build number
              run: echo "BUILD_NUMBER=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

            # What `eas-build-post-install` ran on EAS Build.
            - name: Build the i18n dictionaries
              run: vp exec intlayer build

            # The release skill compares main against this to choose between an OTA
            # and a new build. Generated before prebuild, the way the skill does.
            - name: Record the runtime fingerprint
              run: |
                  mkdir -p "$RUNNER_TEMP/fingerprint"
                  npx expo-updates fingerprint:generate --platform "$EAS_PLATFORM" > "$RUNNER_TEMP/fingerprint/fingerprint.json"

            - uses: actions/upload-artifact@v7
              with:
                  name: fingerprint
                  path: ${{ runner.temp }}/fingerprint/fingerprint.json
                  retention-days: 90

            - name: Prebuild
              run: npx expo prebuild --platform "$EAS_PLATFORM" --no-install

            - name: Install ccache
              if: inputs.platform == 'ios'
              env:
                  HOMEBREW_NO_AUTO_UPDATE: "1"
              run: brew install ccache

            - uses: actions/cache@v6
              if: inputs.platform == 'ios'
              with:
                  path: ~/Library/Caches/ccache
                  key: ccache-ios-${{ github.run_id }}
                  restore-keys: ccache-ios-

            - name: Install pods
              if: inputs.platform == 'ios'
              working-directory: apps/native/ios
              env:
                  USE_CCACHE: "1"
              run: pod install

            # A throwaway keychain, deleted in the last step. Xcode matches profiles
            # by UUID, so each one's UUID and bundle id are read out of the profile.
            - name: Import signing credentials
              if: inputs.platform == 'ios'
              env:
                  EAS_IOS_DIST_P12: ${{ secrets.EAS_IOS_DIST_P12 }}
                  EAS_IOS_P12_PASSWORD: ${{ secrets.EAS_IOS_P12_PASSWORD }}
                  EAS_IOS_PROFILE: ${{ secrets.EAS_IOS_PROFILE }}
                  EAS_IOS_PROFILE_WIDGETS: ${{ secrets.EAS_IOS_PROFILE_WIDGETS }}
                  EAS_IOS_PROFILE_WATCH: ${{ secrets.EAS_IOS_PROFILE_WATCH }}
                  EAS_IOS_PROFILE_WATCH_WIDGET: ${{ secrets.EAS_IOS_PROFILE_WATCH_WIDGET }}
              run: |
                  set -euo pipefail
                  for NAME in EAS_IOS_DIST_P12 EAS_IOS_PROFILE EAS_IOS_PROFILE_WIDGETS EAS_IOS_PROFILE_WATCH EAS_IOS_PROFILE_WATCH_WIDGET; do
                    if [ -z "${!NAME:-}" ]; then
                      echo "::error::The $NAME secret is not set."
                      exit 1
                    fi
                  done

                  KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
                  KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
                  security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
                  security set-keychain-settings -lut 21600 "$KEYCHAIN"
                  security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
                  echo "$EAS_IOS_DIST_P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
                  security import "$RUNNER_TEMP/dist.p12" -P "$EAS_IOS_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
                  rm "$RUNNER_TEMP/dist.p12"
                  security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
                  security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
                  # By SHA-1, so it doesn't matter whether it's an iPhone or Apple Distribution certificate.
                  IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | awk 'NR==1 {print $2}')
                  if [ -z "$IDENTITY" ]; then
                    echo "::error::EAS_IOS_DIST_P12 holds no signing identity. Is the private key in it?"
                    exit 1
                  fi

                  PROFILES_DIR="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
                  mkdir -p "$PROFILES_DIR"
                  : > "$RUNNER_TEMP/profiles.txt"
                  for NAME in EAS_IOS_PROFILE EAS_IOS_PROFILE_WIDGETS EAS_IOS_PROFILE_WATCH EAS_IOS_PROFILE_WATCH_WIDGET; do
                    echo "${!NAME}" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
                    security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
                    UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" "$RUNNER_TEMP/profile.plist")
                    TEAM=$(/usr/libexec/PlistBuddy -c "Print TeamIdentifier:0" "$RUNNER_TEMP/profile.plist")
                    APP_ID=$(/usr/libexec/PlistBuddy -c "Print Entitlements:application-identifier" "$RUNNER_TEMP/profile.plist")
                    cp "$RUNNER_TEMP/profile.mobileprovision" "$PROFILES_DIR/$UUID.mobileprovision"
                    echo "${APP_ID#"$TEAM".} $UUID" >> "$RUNNER_TEMP/profiles.txt"
                    echo "$NAME signs ${APP_ID#"$TEAM".} with profile $UUID"
                  done
                  {
                    echo "SIGNING_KEYCHAIN=$KEYCHAIN"
                    echo "SIGNING_IDENTITY=$IDENTITY"
                    echo "SIGNING_TEAM=$TEAM"
                  } >> "$GITHUB_ENV"

            # Per target, not on the command line: a global PROVISIONING_PROFILE_SPECIFIER
            # also lands on every Pods resource bundle, and xcodebuild rejects those.
            - name: Apply signing settings
              if: inputs.platform == 'ios'
              run: |
                  ruby - <<'RUBY'
                  require 'xcodeproj'
                  profiles = File.readlines(File.join(ENV['RUNNER_TEMP'], 'profiles.txt')).to_h(&:split)
                  project = Xcodeproj::Project.open(Dir['ios/*.xcodeproj'].first)
                  missing = []
                  project.native_targets.each do |target|
                    target.build_configurations.each do |config|
                      bundle = config.build_settings['PRODUCT_BUNDLE_IDENTIFIER'].to_s
                      uuid = profiles[bundle]
                      unless uuid
                        missing << bundle
                        next
                      end
                      config.build_settings.merge!(
                        'CODE_SIGN_STYLE' => 'Manual',
                        'DEVELOPMENT_TEAM' => ENV['SIGNING_TEAM'],
                        'CODE_SIGN_IDENTITY' => ENV['SIGNING_IDENTITY'],
                        'CODE_SIGN_IDENTITY[sdk=iphoneos*]' => ENV['SIGNING_IDENTITY'],
                        'CODE_SIGN_IDENTITY[sdk=watchos*]' => ENV['SIGNING_IDENTITY'],
                        'PROVISIONING_PROFILE_SPECIFIER' => uuid
                      )
                    end
                  end
                  abort("::error::No provisioning profile for #{missing.uniq.join(', ')}. Add one to the secrets listed at the top of this file.") unless missing.empty?
                  project.save
                  RUBY

            - name: Archive
              if: inputs.platform == 'ios'
              run: |
                  set -euo pipefail
                  SCHEME=$(basename ios/*.xcworkspace .xcworkspace)
                  ccache --zero-stats
                  if ! xcodebuild archive \
                    -workspace "ios/$SCHEME.xcworkspace" \
                    -scheme "$SCHEME" \
                    -configuration Release \
                    -destination "generic/platform=iOS" \
                    -archivePath "$RUNNER_TEMP/app.xcarchive" \
                    OTHER_CODE_SIGN_FLAGS="--keychain $SIGNING_KEYCHAIN" \
                    SWIFT_ENABLE_EXPLICIT_MODULES=NO \
                    > "$RUNNER_TEMP/xcodebuild.log" 2>&1; then
                    tail -n 200 "$RUNNER_TEMP/xcodebuild.log"
                    echo "::error::xcodebuild archive failed. The full log is in the xcode-logs artifact."
                    exit 1
                  fi
                  ccache --show-stats --verbose

            - name: Export the IPA
              if: inputs.platform == 'ios'
              run: |
                  set -euo pipefail
                  python3 - <<'PY'
                  import os, plistlib
                  temp = os.environ["RUNNER_TEMP"]
                  with open(f"{temp}/profiles.txt") as fh:
                      profiles = dict(line.split() for line in fh if line.strip())
                  with open(f"{temp}/ExportOptions.plist", "wb") as fh:
                      plistlib.dump({
                          "method": "app-store-connect",
                          "signingStyle": "manual",
                          "teamID": os.environ["SIGNING_TEAM"],
                          "signingCertificate": os.environ["SIGNING_IDENTITY"],
                          "provisioningProfiles": profiles,
                      }, fh)
                  PY
                  xcodebuild -exportArchive \
                    -archivePath "$RUNNER_TEMP/app.xcarchive" \
                    -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
                    -exportPath "$RUNNER_TEMP/export"
                  mkdir -p "$RUNNER_TEMP/build"
                  cp "$RUNNER_TEMP"/export/*.ipa "$RUNNER_TEMP/build/"

            - uses: actions/setup-java@v6
              if: inputs.platform == 'android'
              with:
                  distribution: temurin
                  java-version: "17"

            - uses: android-actions/setup-android@v4
              if: inputs.platform == 'android'

            # AGP honours these injected properties, so the Gradle files stay as
            # prebuild wrote them.
            - name: Build the AAB
              if: inputs.platform == 'android'
              env:
                  EAS_ANDROID_KEYSTORE: ${{ secrets.EAS_ANDROID_KEYSTORE }}
                  EAS_ANDROID_STORE_PASSWORD: ${{ secrets.EAS_ANDROID_STORE_PASSWORD }}
                  EAS_ANDROID_KEY_ALIAS: ${{ secrets.EAS_ANDROID_KEY_ALIAS }}
                  EAS_ANDROID_KEY_PASSWORD: ${{ secrets.EAS_ANDROID_KEY_PASSWORD }}
              run: |
                  set -euo pipefail
                  if [ -z "${EAS_ANDROID_KEYSTORE:-}" ]; then
                    echo "::error::The EAS_ANDROID_KEYSTORE secret is not set. Play only accepts the upload key."
                    exit 1
                  fi
                  echo "$EAS_ANDROID_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/upload.keystore"
                  cd android
                  ./gradlew :app:bundleRelease --no-daemon \
                    "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" \
                    "-Pandroid.injected.signing.store.file=$RUNNER_TEMP/upload.keystore" \
                    "-Pandroid.injected.signing.store.password=$EAS_ANDROID_STORE_PASSWORD" \
                    "-Pandroid.injected.signing.key.alias=$EAS_ANDROID_KEY_ALIAS" \
                    "-Pandroid.injected.signing.key.password=$EAS_ANDROID_KEY_PASSWORD"
                  mkdir -p "$RUNNER_TEMP/build"
                  cp app/build/outputs/bundle/release/*.aab "$RUNNER_TEMP/build/"

            - uses: actions/upload-artifact@v7
              with:
                  name: application-archive
                  path: ${{ runner.temp }}/build/*
                  if-no-files-found: error
                  retention-days: 90

            - uses: actions/upload-artifact@v7
              if: always() && inputs.platform == 'ios'
              with:
                  name: xcode-logs
                  path: ${{ runner.temp }}/xcodebuild.log
                  if-no-files-found: ignore
                  retention-days: 30

            - name: Clean up credentials
              if: always()
              run: |
                  security delete-keychain "$RUNNER_TEMP/build.keychain-db" 2>/dev/null || true
                  rm -f "$RUNNER_TEMP/upload.keystore"
