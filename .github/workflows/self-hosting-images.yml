name: Self-hosting images

on:
    push:
        branches:
            - main
        tags:
            - "v*.*.*"
        paths:
            - .github/workflows/self-hosting-images.yml
            - apps/app/**
            - apps/native/package.json
            - apps/native/src/screens/settings/licenses.json
            - deploy/self-hosting/**
            - packages/**
            - patches/**
            - package.json
            - pnpm-lock.yaml
            - pnpm-workspace.yaml
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: self-hosting-images-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        name: Build ${{ matrix.image }} (${{ matrix.arch }})
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 45
        permissions:
            contents: read
            packages: write
        strategy:
            fail-fast: false
            matrix:
                image: [backend, app]
                arch: [amd64, arm64]
                include:
                    - arch: amd64
                      runner: ubuntu-26.04
                    - arch: arm64
                      runner: ubuntu-26.04-arm
        steps:
            - uses: actions/checkout@v7

            - name: Name the image
              id: name
              run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/outlayr-${{ matrix.image }}" >> "$GITHUB_OUTPUT"

            - uses: docker/setup-buildx-action@v4

            - uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push by digest
              id: build
              uses: docker/build-push-action@v7
              with:
                  context: .
                  file: deploy/self-hosting/${{ matrix.image }}.Dockerfile
                  platforms: linux/${{ matrix.arch }}
                  labels: |
                      org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
                      org.opencontainers.image.revision=${{ github.sha }}
                      org.opencontainers.image.licenses=AGPL-3.0-only
                  outputs: type=image,name=${{ steps.name.outputs.image }},push-by-digest=true,name-canonical=true,push=true
                  cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
                  cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}

            - name: Record the digest
              env:
                  DIGEST: ${{ steps.build.outputs.digest }}
              run: |
                  mkdir -p "$RUNNER_TEMP/digests"
                  touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

            - uses: actions/upload-artifact@v7
              with:
                  name: digests-${{ matrix.image }}-${{ matrix.arch }}
                  path: ${{ runner.temp }}/digests/*
                  if-no-files-found: error
                  retention-days: 1

    publish:
        name: Publish ${{ matrix.image }}
        needs: build
        runs-on: ubuntu-26.04
        timeout-minutes: 10
        permissions:
            contents: read
            packages: write
        strategy:
            matrix:
                image: [backend, app]
        steps:
            - uses: actions/download-artifact@v8
              with:
                  path: ${{ runner.temp }}/digests
                  pattern: digests-${{ matrix.image }}-*
                  merge-multiple: true

            - name: Name the image
              id: name
              run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/outlayr-${{ matrix.image }}" >> "$GITHUB_OUTPUT"

            - uses: docker/setup-buildx-action@v4

            - uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - id: meta
              uses: docker/metadata-action@v6
              with:
                  images: ${{ steps.name.outputs.image }}
                  tags: |
                      type=edge,branch=main
                      type=semver,pattern=v{{version}}

            - name: Push the multi-arch manifest
              working-directory: ${{ runner.temp }}/digests
              env:
                  IMAGE: ${{ steps.name.outputs.image }}
              run: |
                  docker buildx imagetools create \
                    $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
                    $(printf "$IMAGE@sha256:%s " *)
                  docker buildx imagetools inspect "$IMAGE:${{ steps.meta.outputs.version }}"
